# This is a basic workflow to help you get started with Actions

name: Run Arxiv Papers Daily

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Run once daily at 01:00 UTC (09:00 Asia/Shanghai).
    - cron: "0 1 * * *"
  # Triggers the workflow on push or pull request events but only for the main branch
#   push:
#     branches:
#     - main

permissions:
  contents: read

concurrency:
  group: arxiv-papers-daily
  cancel-in-progress: false

env:

  GITHUB_USER_NAME: zyf515730395
  GITHUB_USER_EMAIL: zhangyufan.aiesec@gmail.com
  SUMMARY_ENABLED: "1"
  PAPER_NOTES_ROOT: /mnt/g/share/papers
  VLLM_BASE_URL: http://127.0.0.1:8000/v1
  
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    permissions:
      contents: write
      pages: read
    # The type of runner that the job will run on
    runs-on: [self-hosted, Linux, X64, wsl2, gpu]
    timeout-minutes: 180
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          #architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for local vLLM
        continue-on-error: true
        run: |
          curl --fail --retry 60 --retry-all-errors --retry-delay 5 \
            --retry-max-time 300 --max-time 10 \
            "$VLLM_BASE_URL/models"

      - name: Run daily arxiv 
        run: |
          python daily_arxiv.py
          
      - name: Commit generated files
        run: |
          git config user.name "$GITHUB_USER_NAME"
          git config user.email "$GITHUB_USER_EMAIL"
          git add docs/arxiv-papers-daily-web.json docs/index.html
          git add -A docs/notes
          if git diff --cached --quiet; then
            echo "No paper updates"
          else
            git commit -m "Github Action Automatic Update Arxiv Papers"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
