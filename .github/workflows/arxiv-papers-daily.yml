# This workflow fetches, summarizes, and publishes arXiv papers every day.

name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  schedule:
    # Run once daily at 01:00 UTC (09:00 Asia/Shanghai).
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: arxiv-papers-daily
  cancel-in-progress: false

env:
  GITHUB_USER_NAME: zyf515730395
  GITHUB_USER_EMAIL: zhangyufan.aiesec@gmail.com
  SUMMARY_ENABLED: "1"
  PAPER_NOTES_ROOT: /mnt/g/share/papers
  VLLM_BASE_URL: http://127.0.0.1:8000/v1

jobs:
  build:
    name: update
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, wsl2, gpu]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: /mnt/g/share/projects/arxiv-papers-daily

    steps:
      - name: Synchronize repository
        run: |
          git config core.autocrlf true
          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Expected the shared checkout to be on main" >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Shared checkout has uncommitted changes; refusing to overwrite them" >&2
            git status --short
            exit 1
          fi
          git pull --ff-only origin main

      - name: Prepare Python environment
        run: |
          VENV_PATH=/home/zyf/.cache/arxiv-papers-daily/venv
          if [ ! -x "$VENV_PATH/bin/python" ]; then
            /home/zyf/softwares/miniforge3/envs/vllm/bin/python -m venv "$VENV_PATH"
          fi
          "$VENV_PATH/bin/python" -m pip install --upgrade pip
          "$VENV_PATH/bin/python" -m pip install -r requirements.txt

      - name: Wait for local vLLM
        continue-on-error: true
        run: |
          curl --fail --retry 60 --retry-all-errors --retry-delay 5 --retry-max-time 300 --max-time 10 "$VLLM_BASE_URL/models"

      - name: Run daily arxiv
        run: |
          /home/zyf/.cache/arxiv-papers-daily/venv/bin/python daily_arxiv.py

      - name: Commit generated files
        run: |
          git config user.name "$GITHUB_USER_NAME"
          git config user.email "$GITHUB_USER_EMAIL"
          git add docs/arxiv-papers-daily-web.json docs/index.html
          git add -A docs/notes
          if git diff --cached --quiet; then
            echo "No paper updates"
          else
            git commit -m "Github Action Automatic Update Arxiv Papers"
            git push origin main
          fi

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout generated site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
