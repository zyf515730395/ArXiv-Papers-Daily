max_results: 10

# Ordered paper taxonomy used by local annotation inference and the learning UI.
# Add new entries here; names must remain unique after slugification.
paper_labels:
    - name: "Image Generation"
      description: "Image synthesis, text-to-image, image editing, personalization, controllable generation, diffusion, flow-matching, or autoregressive image generation methods."
    - name: "Video Generation"
      description: "Video synthesis, text-to-video, image-to-video, video editing, animation, or generative audio-video methods."
    - name: "3D Generation"
      description: "Generative 3D or 4D objects, shapes, humans, assets, scenes, worlds, meshes, CAD, or 3D editing."
    - name: "Neural Rendering"
      description: "NeRF, Gaussian Splatting, radiance fields, neural fields, neural scene representations, novel-view synthesis, or differentiable rendering."
    - name: "Depth Estimation"
      description: "Monocular, stereo, multi-view, metric, relative, or completed depth estimation and prediction."
    - name: "Relighting"
      description: "Estimating, transferring, editing, or generating illumination, reflectance, shadows, or appearance under novel lighting."
    - name: "Unified Model"
      description: "A single generative model intentionally unifying multiple modalities, generation tasks, or understanding and generation capabilities."
    - name: "World Model"
      description: "Learned generative or predictive models of environments, physical dynamics, interactive worlds, or action-conditioned future states."

# file paths
json_gitpage_path: './docs/togos-papers.json'
html_gitpage_path: './docs/index.html'
output_root: './docs'
search_index_path: './docs/search-index.json'
candidate_ledger_path: './data/arxiv-candidates.json'
milestone_catalog_path: './config/milestone_models.yaml'

# keywords to search
keywords:
    "Image Generation":
        filters: ["Text-to-Image Generation", "Image Generation Model", "Generative Image Model", "Image Synthesis", "Image Editing", "Image Personalization", "Autoregressive Image Generation", "Flow Matching Image Generation", "Image Diffusion Model", "Diffusion Image Generation", "Stable Diffusion", "Diffusion Transformer Image"]
    "Video Generation":
        filters: ["Text-to-Video Generation", "Image-to-Video Generation", "Video Generation Model", "Generative Video Model", "Video Synthesis", "Video Editing", "Video Personalization", "Autoregressive Video Generation", "Flow Matching Video Generation", "Video Diffusion Model", "Diffusion Video Generation", "Video Diffusion Transformer"]
    "3D Generation":
        filters: ["Text-to-3D", "Image-to-3D", "Video-to-3D", "3D Generation", "Generative 3D", "Generative 3D Model", "3D Model Generation", "3D Object Generation", "3D Shape Generation", "3D Asset Generation", "3D Scene Generation", "3D World Generation", "3D Human Generation", "3D Content Generation", "3D Content Creation", "3DGS Generation", "3D Editing", "Mesh Generation", "CAD Generation", "4D Generation"]
    "Neural Rendering":
        fields: ["ti", "abs"]
        categories: ["cs.CV", "cs.GR", "cs.RO", "eess.IV"]
        filters: ["Neural Rendering", "Novel View Synthesis", "Neural Radiance Field", "Neural Radiance Fields", "NeRF", "Gaussian Splatting", "Radiance Field", "Neural Implicit Surface", "Neural Signed Distance Field", "Differentiable Rendering"]
    "Depth Estimation":
        fields: ["ti", "abs"]
        categories: ["cs.CV", "cs.GR", "cs.RO", "eess.IV"]
        filters: ["Depth Estimation", "Monocular Depth", "Metric Depth", "Stereo Depth Estimation", "Stereo Matching", "Multi-View Stereo", "Depth Completion", "Depth Prediction", "Disparity Estimation"]
