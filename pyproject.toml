[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "togos"
version = "0.1.0"
description = "TOGOS knowledge site generators"
requires-python = ">=3.12"
dependencies = [
  "arxiv>=4.0.0,<5.0.0",
  "bleach>=6.2,<7.0",
  "Markdown>=3.7,<4.0",
  "PyYAML>=6.0,<7.0",
  "requests>=2.32,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
